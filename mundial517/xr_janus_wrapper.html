<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JanusWeb XR Wrapper</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #222; }
        iframe#janusweb-client-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- JanusWeb client will be loaded into this iframe -->
    <iframe id="janusweb-client-iframe" title="JanusWeb Client View" src="https://web.janusxr.org/" allow="xr-spatial-tracking;fullscreen;microphone;camera;gyroscope;accelerometer"></iframe>

    <script>
        const janusWebClientFrame = document.getElementById('janusweb-client-iframe');
        let currentGltfObjectURL = null;

        // Function to tell JanusWeb (inside the iframe) to load a new room from a GLTF URL
        function loadGltfRoomInJanus(gltfUrl) {
            if (janusWebClientFrame && janusWebClientFrame.contentWindow) {
                // JanusWeb's `room.load()` or `room.replace()` is part of its internal API.
                // A common way to interact is by setting room_url or using postMessage if JanusWeb client supports it.
                // For simplicity, we'll try to change the src of an <AssetObject id="room_gltf"> and make the room use it.
                // This requires the JanusWeb content to be structured to accept this.
                // A more direct method if JanusWeb client exposes a global function or specific postMessage API:
                
                // Option 1: If JanusWeb client has a global function (less likely for cross-origin)
                // if (janusWebClientFrame.contentWindow.janus && janusWebClientFrame.contentWindow.janus.setActiveRoom) {
                //    janusWebClientFrame.contentWindow.janus.setActiveRoom({ room_url: gltfUrl });
                // }

                // Option 2: Post a message to the JanusWeb client iframe, assuming it has a listener.
                // This is the most common way to interact with cross-origin iframes if they are designed for it.
                // The JanusWeb client at web.janusxr.org might not have a generic "load GLTF as room" postMessage API.
                // We might need to host a version of JanusWeb client or a specific room definition that listens for this.
                
                // For now, let's assume we can change the 'src' of the iframe to a URL that includes the GLTF
                // as a parameter, if JanusWeb supports loading rooms via URL parameters.
                // e.g., https://web.janusxr.org/lobby?room_url=ENCODED_GLTF_URL
                // This is often how JanusWeb rooms are shared.
                
                // Simplest approach for a self-contained JanusWeb that we might control more:
                // If the JanusWeb client itself listens for a specific postMessage format:
                janusWebClientFrame.contentWindow.postMessage({
                    type: 'loadRoomGLTF',
                    url: gltfUrl
                }, '*'); // Target '*' is broad, be specific if possible.
                
                console.log(`xr_janus_wrapper: Attempted to post 'loadRoomGLTF' with URL: ${gltfUrl} to JanusWeb client.`);
                
                // If we had direct access to janus.js room object:
                // janus.room.load(gltfUrl); // or janus.room.replace(gltfUrl);
            } else {
                console.error("xr_janus_wrapper: JanusWeb client iframe contentWindow not accessible.");
            }
        }

        window.addEventListener('message', function(event) {
            // Optional: Add origin check for security: if (event.origin !== 'expected_origin') return;
            
            if (event.data && event.data.type === 'loadGLTFAsRoom' && event.data.gltfString) {
                console.log("xr_janus_wrapper: Received 'loadGLTFAsRoom' message with GLTF data.");
                
                // Revoke previous object URL if it exists
                if (currentGltfObjectURL) {
                    URL.revokeObjectURL(currentGltfObjectURL);
                    console.log("xr_janus_wrapper: Revoked previous GLTF Object URL:", currentGltfObjectURL);
                }

                try {
                    const blob = new Blob([event.data.gltfString], { type: 'model/gltf+json' });
                    currentGltfObjectURL = URL.createObjectURL(blob);
                    console.log("xr_janus_wrapper: Created new GLTF Object URL:", currentGltfObjectURL);
                    
                    // Now, tell the JanusWeb client (inside the iframe) to load this GLTF URL as the room.
                    // This part is tricky as it depends on how the JanusWeb client is set up to receive such commands.
                    // For this example, we'll assume the JanusWeb client itself (or a script within it)
                    // listens for a 'loadRoomGLTF' postMessage.
                    loadGltfRoomInJanus(currentGltfObjectURL);

                } catch (e) {
                    console.error("xr_janus_wrapper: Error processing GLTF data:", e);
                    if (currentGltfObjectURL) {
                        URL.revokeObjectURL(currentGltfObjectURL); // Clean up if error occurs
                        currentGltfObjectURL = null;
                    }
                }
            } else if (event.data && event.data.type === 'janusNavigate') { // For portal navigation
                 if (janusWebClientFrame && janusWebClientFrame.contentWindow && janusWebClientFrame.contentWindow.janus) {
                    janusWebClientFrame.contentWindow.janus.navigate(event.data.url, event.data.portal_id);
                    console.log(`xr_janus_wrapper: Navigating Janus to ${event.data.url}`);
                 }
            }
        });

        // Inform the parent window that the Janus wrapper is ready (optional)
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'janusWrapperReady' }, '*');
            console.log("xr_janus_wrapper: Posted 'janusWrapperReady' to parent.");
        }

        console.log("xr_janus_wrapper.html loaded and listener is active.");
    </script>
</body>
</html>
