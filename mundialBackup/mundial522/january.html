<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JanusWeb - Preloaded Dependencies</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="loading">Loading JanusWeb environment...</div>
    
    <!-- Pre-load three.js -->
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128/build/three.module.js';
    </script>
    
    <script>
        // Ensure THREE is available globally
        window.THREE = THREE;
        console.log("THREE.js preloaded:", typeof THREE);
        
        // Create a function to load the JanusWeb iframe
        function loadJanusWeb() {
            const loading = document.getElementById('loading');
            const iframe = document.createElement('iframe');
            iframe.src = '/packages/janusweb/build/1.5.42/index.html';
            iframe.id = 'janusweb-iframe';
            
            // Replace loading message with iframe when ready
            iframe.onload = function() {
                // Attempt to inject THREE.js into the iframe context
                try {
                    if (iframe.contentWindow && !iframe.contentWindow.THREE) {
                        iframe.contentWindow.THREE = window.THREE;
                        console.log("Injected THREE.js into iframe context");
                    }
                } catch (e) {
                    console.error("Failed to inject THREE.js into iframe:", e);
                }
                loading.remove();
            };
            
            document.body.appendChild(iframe);
        }
        
        // Load JanusWeb after THREE.js has loaded
        window.addEventListener('DOMContentLoaded', function() {
            console.log("DOM loaded, loading JanusWeb...");
            loadJanusWeb();
        });
    </script>
</body>
</html>
