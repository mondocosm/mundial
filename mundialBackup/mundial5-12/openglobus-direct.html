<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenGlobus Direct Example</title>
    <!-- Load OpenGlobus CSS from the same location as the main project -->
    <link rel="stylesheet" href="../packages/openglobus/lib/@openglobus/og.css" type="text/css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        #globus {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="globus"></div>

    <!-- Load OpenGlobus JS from the same location as the main project -->
    <script src="../packages/openglobus/lib/@openglobus/og.umd.js"></script>
    <script>
        window.onload = function() {
            try {
                // Log to confirm onload is firing
                console.log("window.onload fired");

                const globusDiv = document.getElementById('globus');
                if (globusDiv) {
                    globusDiv.addEventListener('click', function(event) {
                        console.log('Native DOM click event on #globus div:', event);
                    });
                    console.log("Native DOM click listener added to #globus div");
                } else {
                    console.error("#globus div not found");
                }

                // Create globe with GlobusRgbTerrain (same as in main.js)
                const globe = new og.Globe({
                target: "globus",
                name: "Earth",
                terrain: new og.terrain.GlobusRgbTerrain(),
                layers: [
                    new og.layer.XYZ("Satellite", {
                        isBaseLayer: true,
                        url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                        visibility: true,
                        attribution: 'Tiles © ArcGIS',
                        maxZoom: 19
                    }),
                    new og.layer.XYZ("OpenStreetMap", {
                        isBaseLayer: true,
                        url: "//{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                        visibility: false,
                        attribution: 'Data @ OpenStreetMap contributors, ODbL'
                    })
                ]
            });

            // Add grid layer
            const gridLayer = new og.layer.CanvasTiles("ZL21 Grid", {
                minZoom: 16,
                maxZoom: 21,
                visibility: true,
                opacity: 1.0,
                isBaseLayer: false,
                drawTile: function (material, applyTexture) {
                    const canvas = document.createElement("canvas");
                    const size = 256;
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');

                    if (!ctx) {
                        console.error("Failed to get 2D context for grid tile canvas");
                        applyTexture(canvas);
                        return;
                    }

                    if (!material.segment) {
                        console.warn("drawTile called with null material.segment for ZL21 Grid");
                        applyTexture(canvas);
                        return;
                    }

                    ctx.clearRect(0, 0, size, size);

                    const currentTileZoom = material.segment.tileZoom;
                    const targetGridZoom = 21;

                    if (currentTileZoom >= gridLayer.minZoom && currentTileZoom <= gridLayer.maxZoom) {
                        const lineWeight = 2;
                        ctx.lineWidth = lineWeight;
                        ctx.strokeStyle = 'rgba(0, 0, 0, 1)';

                        const maxZoomDiff = 5;
                        const zoomDiff = Math.min(targetGridZoom - currentTileZoom, maxZoomDiff);
                        const subdivisions = Math.pow(2, zoomDiff);

                        const step = size / subdivisions;

                        // Draw vertical lines
                        for (let i = 1; i < subdivisions; i++) {
                            const x = i * step;
                            ctx.beginPath();
                            ctx.moveTo(x, 0);
                            ctx.lineTo(x, size);
                            ctx.stroke();
                        }
                        
                        // Draw horizontal lines
                        for (let i = 1; i < subdivisions; i++) {
                            const y = i * step;
                            ctx.beginPath();
                            ctx.moveTo(0, y);
                            ctx.lineTo(size, y);
                            ctx.stroke();
                        }
                        
                        // Draw outer border
                        ctx.beginPath();
                        ctx.rect(0, 0, size, size);
                        ctx.stroke();
                    }

                    applyTexture(canvas);
                }
            });

            globe.planet.addLayer(gridLayer);

            // Set initial view to Statue of Liberty
            globe.planet.viewLonLat(new og.LonLat(-74.0445, 40.6892, 500));

            // Add click event listener
            globe.planet.events.on("lclick", function (mouse) {
                console.log("lclick event fired:", mouse);
                const lonLat = globe.planet.getLonLatFromPixelTerrain(mouse.pos);
                if (lonLat) {
                    console.log("Clicked coordinates (LonLat object):", lonLat);
                    console.log("Clicked Longitude:", lonLat.lon, "Latitude:", lonLat.lat, "Altitude:", lonLat.alt);
                } else {
                    console.log("Could not get LonLat from pixel. Mouse position:", mouse.pos);
                }
            });

            // Test a different event type if lclick is not working
            globe.planet.events.on("click", function (mouse) {
                console.log("planet 'click' event fired:", mouse);
                const lonLat = globe.planet.getLonLatFromPixelTerrain(mouse.pos);
                if (lonLat) {
                    console.log("Planet 'click' Coords (LonLat object):", lonLat);
                } else {
                    console.log("Planet 'click': Could not get LonLat. Mouse pos:", mouse.pos);
                }
            });

            // Also try events on the globe.renderer
            if (globe.renderer) {
                globe.renderer.events.on("lclick", function (mouse) {
                    console.log("renderer 'lclick' event fired:", mouse);
                     const lonLat = globe.planet.getLonLatFromPixelTerrain(mouse.pos);
                    if (lonLat) {
                        console.log("Renderer 'lclick' Coords (LonLat object):", lonLat);
                    } else {
                        console.log("Renderer 'lclick': Could not get LonLat. Mouse pos:", mouse.pos);
                    }
                });
                 console.log("Renderer lclick listener added");
            } else {
                console.log("globe.renderer not available to attach event");
            }


            console.log("OpenGlobus globe object initialized:", globe);

        } catch (e) {
            console.error("Error during OpenGlobus initialization or event setup:", e);
        }
        };
    </script>
</body>
</html>
