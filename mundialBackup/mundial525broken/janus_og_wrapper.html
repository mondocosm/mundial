<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JanusWeb OpenGlobus Wrapper (Iframe Method)</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        iframe { border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <iframe id="janus-iframe-og" title="JanusWeb Client View"></iframe>
    <script>
        const janusIframe = document.getElementById('janus-iframe-og');
        
        // Point to the local media/index.html which uses local JS, CDN CSS, and has polling script
        const iframeSrc = '/mundial/janus_client_local/media/index.html';
        
        console.log('[JanusOGWrapper_Iframe] Setting internal iframe src to (janus_client_local/media/index.html with local JS, NO CSS, networking=false):', iframeSrc);
        janusIframe.src = iframeSrc;

        // Relay messages from parent (main.js) to the JanusWeb client iframe
        window.addEventListener('message', function(event) {
            if (janusIframe && janusIframe.contentWindow) {
                // Check for our specific message type
                if (event.data && event.data.type === 'loadGLTFAsRoom') {
                    console.log('[JanusOGWrapper_Iframe] Relaying message to janus-iframe:', event.data);
                    // The targetOrigin should be the origin of the iframe's content.
                    // Using '*' for simplicity in local dev, but could be more specific.
                    janusIframe.contentWindow.postMessage(event.data, '*');
                }
            }
        });
        console.log('[JanusOGWrapper_Iframe] Initialized.');
    </script>
</body>
</html>
