<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Babylon.js + MapLibre</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        #maplibre-map {
            width: 50%; /* Example layout: map on left */
            height: 100%;
            float: left;
        }
        #babylon-canvas {
            width: 50%; /* Example layout: Babylon on right */
            height: 100%;
            float: left;
            touch-action: none; /* Recommended for Babylon.js */
        }
        /* Basic error/status message styling */
        .status-message {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px;
            background-color: rgba(0,0,0,0.7);
            color: white;
            border-radius: 5px;
            z-index: 10;
        }
        .controls {
            position: absolute;
            top: 10px;
            left: 10px; /* Position controls on the MapLibre side */
            background: rgba(255,255,255,0.8);
            padding: 5px;
            border-radius: 3px;
            z-index: 100;
        }
        .controls button {
            display: block;
            margin-bottom: 5px;
        }
    </style>
    <!-- MapLibre GL JS (v5.5.0 from your example) -->
    <link href="https://unpkg.com/maplibre-gl@5.5.0/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@5.5.0/dist/maplibre-gl.js"></script>
    <!-- Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
    <div class="controls">
        <button type="button" id="toggle-terrain-btn">Toggle Terrain</button>
        <button type="button" id="toggle-buildings-btn">Toggle Buildings</button>
    </div>
    <div id="maplibre-map"></div>
    <canvas id="babylon-canvas"></canvas>
    <div id="status" class="status-message" style="display: none;"></div>

    <script>
        let map;
        let engine;
        let scene;

        // --- Tile Math Utilities ---
        function long2tile(lon, zoom) { return (Math.floor((lon + 180) / 360 * Math.pow(2, zoom))); }
        function lat2tile(lat, zoom)  { return (Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom))); }
        function tile2long(x, zoom) { return (x / Math.pow(2, zoom) * 360 - 180); }
        function tile2lat(y, zoom) {
            const n = Math.PI - 2 * Math.PI * y / Math.pow(2, zoom);
            return (180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))));
        }
        // --- End Tile Math Utilities ---

        let gridSourceInitialized = false; // Flag to ensure source/layer are added only once

        const mapTilerKey = "T82iw5O12y2FVZUGLFIX"; // IMPORTANT: Replace this
        
        function showStatus(message) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
            console.log("Status:", message);
        }

        // Initialize MapLibre
        function initMapLibre(initialCenter = [-74.0066, 40.7135], initialZoom = 15.5) {
            try {
                map = new maplibregl.Map({
                    container: 'maplibre-map',
                    zoom: initialZoom,
                    center: initialCenter,
                    pitch: 45, 
                    bearing: -17.6,
                    style: {
                        version: 8,
                        sources: {
                            osm: {
                                type: 'raster',
                                tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'],
                                tileSize: 256,
                                attribution: '&copy; OpenStreetMap Contributors',
                                maxzoom: 19
                            },
                            terrainSource: { // Switched to MapTiler Terrain RGB
                                type: 'raster-dem',
                                // url: 'https://demotiles.maplibre.org/terrain-tiles/tiles.json', // Old problematic source
                                tiles: [`https://api.maptiler.com/tiles/terrain-rgb-v2/{z}/{x}/{y}.png?key=${mapTilerKey}`],
                                tileSize: 256, // MapTiler Terrain RGB is typically 256x256 or 512x512 for @2x
                                // encoding: "mapbox", // MapLibre usually auto-detects for Mapbox/MapTiler Terrain RGB
                                maxzoom: 14 // Max zoom for MapTiler Terrain RGB v2
                            },
                            openmaptiles_buildings: {
                                type: 'vector',
                                url: `https://api.maptiler.com/tiles/v3/tiles.json?key=${mapTilerKey}`
                            }
                        },
                        layers: [
                            {
                                id: 'osm',
                                type: 'raster',
                                source: 'osm'
                            },
                            { // Optional hillshade layer for better terrain visualization
                                id: 'hills',
                                type: 'hillshade',
                                source: 'terrainSource', // Use the same DEM source
                                layout: {visibility: 'visible'},
                                paint: {'hillshade-shadow-color': '#473B24'}
                            }
                            // 3D Buildings layer will be added on load if source exists
                        ],
                        terrain: { // Terrain initially enabled
                            source: 'terrainSource',
                            exaggeration: 1.0
                        }
                        // Removed sky property entirely for now to see if map loads
                    },
                    maxZoom: 18,
                    maxPitch: 85
                });

                map.on('load', () => {
                    showStatus('MapLibre map loaded. Configuring layers and grid...');
                    
                    // Add ZL21 Grid Source and Layer
                    if (!map.getSource('grid-source')) {
                        map.addSource('grid-source', {
                            type: 'geojson',
                            data: { type: 'FeatureCollection', features: [] }
                        });
                    }
                    if (!map.getLayer('grid-layer')) {
                        map.addLayer({
                            id: 'grid-layer',
                            type: 'line',
                            source: 'grid-source',
                            paint: {
                                'line-color': '#00FFFF', // Cyan
                                'line-width': 1,
                                'line-opacity': 0.4
                            },
                            minzoom: 18 // Only show ZL21 grid at high zoom levels
                        });
                    }
                    gridSourceInitialized = true;
                    updateMapGrid(); // Initial grid draw

                    map.on('moveend', updateMapGrid);
                    map.on('zoomend', updateMapGrid);

                    const layers = map.getStyle().layers;
                    let labelLayerId;
                    for (let i = 0; i < layers.length; i++) {
                        if (layers[i].type === 'symbol' && layers[i].layout && layers[i].layout['text-field']) {
                            labelLayerId = layers[i].id;
                            break;
                        }
                    }

                    // Add 3D Buildings Layer (initially visible by default if source exists)
                    if (map.getSource('openmaptiles_buildings')) {
                        map.addLayer(
                            {
                                'id': '3d-buildings',
                                'source': 'openmaptiles_buildings',
                                'source-layer': 'building',
                                'type': 'fill-extrusion',
                                'minzoom': 14,
                                'filter': ['!=', ['get', 'hide_3d'], true],
                                'paint': {
                                    'fill-extrusion-color': [
                                        'interpolate', ['linear'], ['get', 'render_height'],
                                        0, 'lightgray', 50, 'royalblue', 100, 'darkslateblue'
                                    ],
                                    'fill-extrusion-height': ['get', 'render_height'],
                                    'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
                                    'fill-extrusion-opacity': 0.85
                                }
                            },
                            labelLayerId
                        );
                        showStatus('MapLibre map configured with terrain and 3D buildings.');
                    } else {
                        showStatus('MapLibre map configured with terrain. Building source "openmaptiles_buildings" not available.');
                        console.warn("Building source 'openmaptiles_buildings' not found in style, skipping 3d-buildings layer.");
                    }
                    // --- End re-enable 3D Buildings Layer ---


                    map.addControl(new maplibregl.NavigationControl({visualizePitch: true}));
                    if (map.getSource('terrainSource')) {
                        map.addControl(new maplibregl.TerrainControl({source: 'terrainSource', exaggeration: 1.0})); 
                    }
                });
                map.on('error', (e) => {
                    console.error('MapLibre Error:', e);
                    showStatus('MapLibre Error: ' + (e.error?.message || 'Unknown error'));
                });
            } catch (err) {
                console.error("Failed to initialize MapLibre:", err);
                showStatus("Failed to initialize MapLibre: " + err.message);
            }
        }

        // Initialize Babylon.js
        function initBabylon() {
            const canvas = document.getElementById('babylon-canvas');
            if (!canvas) {
                console.error("Babylon canvas not found!");
                showStatus("Babylon canvas not found!");
                return;
            }
            try {
                engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
                scene = new BABYLON.Scene(engine);
                scene.clearColor = new BABYLON.Color4(0.2, 0.2, 0.3, 1);

                const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 10, new BABYLON.Vector3(0, 0, 0), scene);
                camera.attachControl(canvas, true);
                const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(1, 1, 0), scene);
                const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 6, height: 6}, scene);
                const groundMaterial = new BABYLON.StandardMaterial("groundMat", scene);
                groundMaterial.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                ground.material = groundMaterial;
                
                showStatus('Babylon.js scene initialized.');

                engine.runRenderLoop(() => {
                    if (scene && scene.activeCamera) {
                        scene.render();
                    }
                });
                window.addEventListener('resize', () => { if (engine) { engine.resize(); } });
            } catch (err) {
                console.error("Failed to initialize Babylon.js:", err);
                showStatus("Failed to initialize Babylon.js: " + err.message);
            }
        }

        let initialViewData = null;
        let currentTilesetAssetContainer = null; // To keep track of the loaded GLTF model

        function receiveSetupData(event) {
            // console.log("Babylon Iframe received message:", event.data); // General log for all messages

            // if (event.origin !== "http://localhost:8000" && event.origin !== "null") return; // Origin check for security

            if (event.data && event.data.type === 'initialSetup') {
                console.log("Received initialSetup data:", event.data);
                if (event.data.mapView) {
                    initialViewData = event.data.mapView;
                }

                if (!map) {
                    initMapLibre(initialViewData?.center, initialViewData?.zoom);
                } else {
                     if (initialViewData && initialViewData.center && typeof initialViewData.zoom === 'number') {
                        map.setCenter(initialViewData.center);
                        map.setZoom(initialViewData.zoom);
                        showStatus(`Map view updated to Lon: ${initialViewData.center[0].toFixed(4)}, Lat: ${initialViewData.center[1].toFixed(4)}, Zoom: ${initialViewData.zoom.toFixed(2)}`);
                    }
                }
                
                // Legacy placeholder tile processing (can be removed if GLTF is primary)
                // const tiles = event.data.tilesetData;
                // if (tiles && tiles.length > 0) {
                //     showStatus(`Received ${tiles.length} placeholder tiles for Babylon.js scene.`);
                //     processTilesForBabylon(tiles); // This creates simple colored planes
                // } else {
                //     showStatus("No placeholder tileset data received for Babylon.js, or tileset is empty.");
                // }

            } else if (event.data && event.data.type === 'loadGLTF') {
                console.log("Received loadGLTF command.");
                if (event.data.gltfString) {
                    loadGLTFIntoBabylon(event.data.gltfString);
                } else {
                    console.error("loadGLTF message received, but no gltfString was provided.");
                    showStatus("Error: GLTF data missing in message.");
                }
            }
        }

        async function loadGLTFIntoBabylon(gltfString) {
            if (!scene) {
                showStatus("Babylon.js scene not ready to load GLTF.");
                console.error("Babylon scene not initialized when trying to load GLTF.");
                return;
            }
            showStatus("Loading GLTF model into Babylon.js scene...");

            // Clear previously loaded GLTF model
            if (currentTilesetAssetContainer) {
                console.log("Disposing of previously loaded GLTF model.");
                currentTilesetAssetContainer.dispose();
                currentTilesetAssetContainer = null;
            }
            // Also clear any placeholder meshes if they exist
            const placeholderMeshes = scene.getMeshesByTags("placeholderTile");
            placeholderMeshes.forEach(mesh => mesh.dispose());


            try {
                // BABYLON.SceneLoader.loggingLevel = BABYLON.SceneLoader.DETAILED_LOGGING; // For debugging GLTF loading
                const container = await BABYLON.SceneLoader.ParseAssetContainerAsync(
                    "", // rootUrl, not needed for data string
                    gltfString, // data string
                    scene,
                    ".gltf" // fileExtension
                );
                currentTilesetAssetContainer = container;
                container.addAllToScene();
                
                // Optional: Auto-frame the loaded model
                if (container.meshes.length > 0) {
                    let minVec = null;
                    let maxVec = null;

                    container.meshes.forEach(mesh => {
                        mesh.computeWorldMatrix(true); // Ensure world matrix is up to date
                        const boundingInfo = mesh.getBoundingInfo();
                        if (boundingInfo) {
                            const meshMin = boundingInfo.boundingBox.minimumWorld;
                            const meshMax = boundingInfo.boundingBox.maximumWorld;
                            if (!minVec) {
                                minVec = meshMin.clone();
                                maxVec = meshMax.clone();
                            } else {
                                minVec = BABYLON.Vector3.Minimize(minVec, meshMin);
                                maxVec = BABYLON.Vector3.Maximize(maxVec, meshMax);
                            }
                        }
                    });

                    if (minVec && maxVec && scene.activeCamera && scene.activeCamera.target) {
                        const center = BABYLON.Vector3.Center(minVec, maxVec);
                        scene.activeCamera.target = center;
                        
                        const extent = maxVec.subtract(minVec);
                        const maxSize = Math.max(extent.x, extent.y, extent.z);
                        const camDistance = maxSize * 1.5 / Math.tan(scene.activeCamera.fov / 2); // Adjust multiplier as needed
                        
                        // Assuming ArcRotateCamera
                        if (scene.activeCamera.radius !== undefined) {
                             scene.activeCamera.radius = Math.max(camDistance, 10); // Ensure a minimum radius
                        }
                        console.log("Framed GLTF model. Center:", center, "Radius/Distance:", scene.activeCamera.radius || camDistance);
                    }
                }
                showStatus(`GLTF model loaded and added to scene. Meshes: ${container.meshes.length}`);

            } catch (error) {
                console.error("Error parsing or loading GLTF into Babylon.js:", error);
                showStatus("Error loading GLTF: " + (error.message || "Unknown GLTF loading error."));
            }
        }

        function processTilesForBabylon(tiles) { // This creates placeholder colored planes
             if (!scene) {
                showStatus("Babylon.js scene not ready to receive tiles.");
                return;
            }
            const existingGround = scene.getMeshByName("ground");
            if (existingGround) {
                existingGround.dispose();
            }
            const TILE_WORLD_SIZE = 10; 
            const TILE_Y_OFFSET = 0;    

            tiles.forEach((tile, index) => {
                const posX = index * TILE_WORLD_SIZE; 
                const posZ = 0; 
                // Add a tag to easily find and remove these later
                const tilePlane = BABYLON.MeshBuilder.CreateGround(`tile_${tile.z}_${tile.x}_${tile.y}`, {
                    width: TILE_WORLD_SIZE,
                    height: TILE_WORLD_SIZE
                }, scene);
                tilePlane.position = new BABYLON.Vector3(posX, TILE_Y_OFFSET, posZ);
                const tileMaterial = new BABYLON.StandardMaterial(`tileMat_${index}`, scene);
                const colors = [new BABYLON.Color3(1,0,0), new BABYLON.Color3(0,1,0), new BABYLON.Color3(0,0,1), new BABYLON.Color3(1,1,0)];
                tileMaterial.diffuseColor = colors[index % colors.length];
                tileMaterial.alpha = 0.7;
                tilePlane.material = tileMaterial;
                BABYLON.Tags.AddTagsTo(tilePlane, "placeholderTile");
                console.log(`Created Babylon placeholder plane for tile Z:${tile.z} X:${tile.x} Y:${tile.y} at world X:${posX} Z:${posZ}`);
            });
            showStatus(`Processed ${tiles.length} tiles into Babylon.js scene.`);
        }

        function updateMapGrid() {
            if (!map || !gridSourceInitialized || map.getZoom() < 18) { // Check zoom level
                if (map && map.getSource('grid-source')) {
                     // Clear grid if zoomed out too far
                    map.getSource('grid-source').setData({ type: 'FeatureCollection', features: [] });
                }
                return;
            }

            const ZL21 = 21;
            const bounds = map.getBounds();
            const ne = bounds.getNorthEast();
            const sw = bounds.getSouthWest();

            // Get tile range for ZL21
            const minTileX = long2tile(sw.lng, ZL21);
            const maxTileX = long2tile(ne.lng, ZL21);
            const minTileY = lat2tile(ne.lat, ZL21); // Note: lat2tile is inverted for typical map Y
            const maxTileY = lat2tile(sw.lat, ZL21);

            const gridFeatures = [];

            // Horizontal lines
            for (let y = minTileY; y <= maxTileY + 1; y++) {
                const lat = tile2lat(y, ZL21);
                gridFeatures.push({
                    type: 'Feature',
                    geometry: {
                        type: 'LineString',
                        coordinates: [[tile2long(minTileX, ZL21), lat], [tile2long(maxTileX + 1, ZL21), lat]]
                    }
                });
            }

            // Vertical lines
            for (let x = minTileX; x <= maxTileX + 1; x++) {
                const lon = tile2long(x, ZL21);
                gridFeatures.push({
                    type: 'Feature',
                    geometry: {
                        type: 'LineString',
                        coordinates: [[lon, tile2lat(minTileY, ZL21)], [lon, tile2lat(maxTileY + 1, ZL21)]]
                    }
                });
            }
            
            if (map.getSource('grid-source')) {
                map.getSource('grid-source').setData({
                    type: 'FeatureCollection',
                    features: gridFeatures
                });
            }
            // console.log(`Updated ZL21 grid with ${gridFeatures.length} lines.`);
        }


        document.addEventListener('DOMContentLoaded', () => {
            showStatus('Initializing components...');
            initBabylon(); // Init Babylon first
            
            // Fallback to initialize MapLibre with defaults if no message received after a short delay
            setTimeout(() => {
                if (!map) { // If message hasn't initialized map yet
                    console.log("No initialSetup message received or map not yet initialized by message, initializing MapLibre with defaults.");
                    initMapLibre(initialViewData?.center, initialViewData?.zoom); 
                }
            }, 500); 

            window.addEventListener('message', receiveSetupData); // Listen for setup data

            // Setup toggle button listeners
            document.getElementById('toggle-terrain-btn')?.addEventListener('click', () => {
                if (!map) return;
                const currentTerrain = map.getTerrain();
                if (currentTerrain) {
                    map.setTerrain(null);
                    showStatus('Terrain disabled.');
                } else {
                    if (map.getSource('terrainSource')) {
                        map.setTerrain({source: 'terrainSource', exaggeration: 1.0});
                        showStatus('Terrain enabled.');
                    } else {
                        showStatus('Terrain source not available to enable.');
                        console.warn('Cannot enable terrain: terrainSource is not defined.');
                    }
                }
            });

            document.getElementById('toggle-buildings-btn')?.addEventListener('click', () => {
                if (!map) return;
                const buildingLayer = map.getLayer('3d-buildings');
                if (buildingLayer) {
                    const visibility = map.getLayoutProperty('3d-buildings', 'visibility');
                    if (visibility === 'visible' || visibility === undefined) {
                        map.setLayoutProperty('3d-buildings', 'visibility', 'none');
                        showStatus('3D Buildings hidden.');
                    } else {
                        map.setLayoutProperty('3d-buildings', 'visibility', 'visible');
                        showStatus('3D Buildings shown.');
                    }
                } else {
                    showStatus('3D Buildings layer not available to toggle.');
                    console.warn('Cannot toggle buildings: 3d-buildings layer not defined.');
                }
            });
        });
    </script>
</body>
</html>
