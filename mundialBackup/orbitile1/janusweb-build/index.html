    <script id="janusweb-js" src="janusweb.min.js"></script>

  <body>
    <div id="janusweb_container"></div>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var container = document.getElementById('janusweb_container');
        // basePath is no longer used for init paths, but keep for potential other uses
        var basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);

        if (container && typeof elation !== 'undefined' && elation.janusweb && typeof elation.janusweb.init === 'function') {
          console.log('[Mondocosm Init] Attempting elation.janusweb.init with corrected paths and networking disabled.');
          elation.janusweb.init({
            el: container,
            url: 'media/assets/webui/default.html',
            homepage: 'media/assets/webui/default.html',
            uiconfig: 'media/assets/webui/default.json',
            avatarsrc: null, // Prevent loading "undefined" avatar
            usevoip: false,
            networking: false, // Explicitly disable networking
            server: '',        // Ensure no server is used
            corsproxy: '',     // Disable CORS proxy if not needed locally
            autoload: true
          }).then(function(client) {
            console.log('[Mondocosm Init] elation.janusweb.init promise resolved. Client:', client);
            window.janus = client;
            if (client && client.janusweb && typeof client.janusweb.stopNetworking === 'function') {
              client.janusweb.stopNetworking(); // Try to ensure networking is off
              console.log('[Mondocosm Init] Called client.janusweb.stopNetworking()');
            }
          }).catch(function(err) {
            console.error('[Mondocosm Init] elation.janusweb.init promise rejected. Error:', err);
          });
        } else {
          console.error('[Mondocosm Init] Could not initialize JanusWeb: elation.janusweb.init not found or container missing.');
        }
      });
    </script>
