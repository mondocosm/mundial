<!DOCTYPE html>
<html lang="en">
<head>
  <title>Emoji AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.js"></script>
  <script src="script.js"></script>
</head>
<body>
  <a-scene mindar-face embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera active="false" position="0 0 0"></a-camera>
    <a-entity mindar-face-target="anchorIndex: 168">
      <!-- 3D emoji will be placed here -->
    </a-entity>
  </a-scene>
</body>
</html>
