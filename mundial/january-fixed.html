<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JanusWeb - Fixed Dependencies</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #222;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: sans-serif;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>
    <div id="loading">Loading JanusWeb environment...</div>

    <iframe id="janusweb-iframe" title="JanusWeb Content View"></iframe>

    <script>
        const iframe = document.getElementById('janusweb-iframe');
        const loading = document.getElementById('loading');
        const janusWebBuildPath = window.location.origin + '/packages/janusweb/build/1.5.42/';

        function getDependencyFixScripts_inline() { // This script is injected AFTER three.js is loaded in iframe
            return `
console.log('[FixScript] Executing dependency fixes...');
// Clamp and MathUtils Polyfill
if (typeof THREE !== 'undefined') {
  console.log('[FixScript] THREE is defined. Attempting to polyfill MathUtils.clamp and Math.clamp.');
  if (typeof THREE.MathUtils === 'undefined') {
    console.log('[FixScript] THREE.MathUtils was undefined, creating.');
    THREE.MathUtils = {};
  }
  if (typeof THREE.MathUtils.clamp !== 'function') {
    console.log('[FixScript] THREE.MathUtils.clamp was not a function, defining.');
    THREE.MathUtils.clamp = function(value, min, max) { return Math.max(min, Math.min(max, value)); };
  } else {
    console.log('[FixScript] THREE.MathUtils.clamp already exists.');
  }
  // Ensure THREE.Math.clamp is also set, aliasing if THREE.Math itself is missing.
  if (typeof THREE.Math === 'undefined') {
    console.log('[FixScript] THREE.Math was undefined, aliasing to THREE.MathUtils.');
    THREE.Math = THREE.MathUtils; // This ensures THREE.Math.clamp will use the above definition.
  } else if (typeof THREE.Math.clamp !== 'function') {
    console.log('[FixScript] THREE.Math.clamp was not a function, defining from THREE.MathUtils.clamp.');
    THREE.Math.clamp = THREE.MathUtils.clamp;
  } else {
    console.log('[FixScript] THREE.Math.clamp already exists.');
  }
} else {
  console.warn('[FixScript] THREE is undefined when dependencyFixesScriptEl runs. Clamp will not be fixed here.');
}
// extendclass is now defined directly in iframeContent, so no need to check/define it here.
console.log('[FixScript] Dependency fix scripts finished.');
`;
        }

        function getConfigScript_inline(buildPath, host, port, protocol) {
            const proto = protocol.slice(0, -1);
            const fullHost = host + (port ? ':' + port : '');
            const rootDir = '/packages/janusweb/build/1.5.42/';

            return `
console.log('[IFrame Config] Setting up elation.config overrides.');
window.elation = window.elation || {};
window.elation.config = window.elation.config || {};

// Helper to set nested properties
function setDeep(obj, path, value) {
    const parts = path.split('.');
    let current = obj;
    for (let i = 0; i < parts.length - 1; i++) {
        current[parts[i]] = current[parts[i]] || {};
        current = current[parts[i]];
    }
    current[parts[parts.length - 1]] = value;
}

const settings_iframe = {
    // Essential pathing - KEEP
    'dependencies.protocol': '\${proto}',
    'dependencies.host': '\${fullHost}',
    'dependencies.rootdir': '\${rootDir}', // Should be /packages/janusweb/build/1.5.42/
    'dependencies.path': '\${buildPath}',   // Should be /packages/janusweb/build/1.5.42/

    'janusweb.datapath': '\${buildPath}media/', // Path to media folder within build - KEEP for resolving internal assets

    // Explicitly disable networking and related features - KEEP
    'janusweb.network.enabled': false,
    'janusweb.network.host': '',
    'janusweb.network.port': '',
    'janusweb.network.server': '',
    'janusweb.network.app': '',
    'janusweb.network.secure': false,
    'janusweb.network.corsproxy': '',
    'janusweb.network.adapter': null,
    'janusweb.network.connectOnLoad': false,

    // Disable VOIP - KEEP
    'janusweb.usevoip': false,
    'engine.janusweb.usevoip': false, // Redundant but ensure it's off

    // Disable tracking, XR, gamepad - KEEP
    'janusweb.tracking.enabled': false,
    'janusweb.xr.enabled': false,
    'janusweb.gamepad.enabled': false,

    // Mute audio - KEEP for now
    'engine.systems.audio.args.muted': true,
    'engine.systems.audio.muted': true,

    // Let JanusWeb use its defaults for these, remove our overrides
    // 'engine.assets.font.path': '\${buildPath}media/fonts/', // Default should be derived from datapath
    // 'engine.systems.world.skybox.texture_path': '\${buildPath}media/skybox/default/', // Default should be derived
    // 'engine.systems.world.skybox.texture_ext': 'jpg', // Default
    // 'engine.systems.physics.enabled': false, // Let it default (likely true, but we're not loading complex rooms)
    // 'engine.systems.ai.enabled': false,       // Let it default

    'janusweb.client.version': 'Mondocosm Embedded Minimal Config', // Update version string
    'janusweb.start_url': '', // Let init control this
    'janusweb.homepage': ''  // Let init control this

    // Removed:
    // 'janusweb.player.stereo': false,
    // 'janusweb.player.viewmode': 'mono',
    // 'engine.systems.render.stereo': false,
    // 'engine.systems.render.viewmode': 'mono'
};

for (const key in settings_iframe) {
    setDeep(window.elation.config, key, settings_iframe[key]);
}

// Stub elation.config.set and get if they don't exist (JanusWeb might define them later)
if (typeof window.elation.config.set !== 'function') {
    window.elation.config.set = function(path, value) { setDeep(window.elation.config, path, value); };
}
if (typeof window.elation.config.get !== 'function') {
    window.elation.config.get = function(path) {
        const parts = path.split('.');
        let current = window.elation.config;
        for (let i = 0; i < parts.length; i++) {
            if (current && typeof current === 'object' && parts[i] in current) { current = current[parts[i]]; }
            else { return undefined; }
        }
        return current;
    };
}
console.log('[IFrame Config] elation.config overrides applied. Current config:', JSON.stringify(window.elation.config, null, 2));
`;
        }

        function getJanusInitScript_inline(parentOrigin) { // Pass parent's origin
            return `
console.log('[JanusInitScript] START of janusInitializer script execution. Parent origin: ${parentOrigin}');
// Final clamp check/polyfill just before init
if (typeof THREE !== 'undefined') {
  if (typeof THREE.MathUtils === 'undefined') { THREE.MathUtils = {}; }
  if (typeof THREE.MathUtils.clamp !== 'function') {
    THREE.MathUtils.clamp = function(value, min, max) { return Math.max(min, Math.min(max, value)); };
    console.log('[JanusInitScript] Applied THREE.MathUtils.clamp polyfill (final check).');
  }
  if (typeof THREE.Math === 'undefined') { THREE.Math = THREE.MathUtils; }
  else if (typeof THREE.Math.clamp !== 'function') { THREE.Math.clamp = THREE.MathUtils.clamp; }
} else {
  console.warn('[JanusInitScript] THREE undefined, cannot apply final clamp check for init.');
}

document.addEventListener('DOMContentLoaded', function() {
  var container = document.getElementById('janusweb_container'); // Corrected: use 'document'
  console.log('[Mondocosm Init] DOMContentLoaded. Container:', container);
  console.log('[Mondocosm Init] typeof elation:', typeof elation, 'elation.janusweb:', (typeof elation !== 'undefined' ? typeof elation.janusweb : 'N/A'));
  if (container && typeof elation !== 'undefined' && elation.janusweb && typeof elation.janusweb.init === 'function') {
    console.log('[Mondocosm Init] Attempting elation.janusweb.init.');
    elation.janusweb.init({
      el: container, // Restore our container
      url: '/mundial/empty.html',
      homepage: '/mundial/empty.html',
      // uiconfig: '/mundial/testing_ui.json', // Omit uiconfig, let JanusWeb use its default
      avatarsrc: '',
      networking: false,
      corsproxy: '',
      usevoip: false,
      autoload: true,
      // Explicitly set some paths that might be causing issues with 'nullmedia'
      // These are usually derived from datapath, but let's be explicit if problems persist
      // 'janusweb.ui.apps.path': 'assets/webui/apps/', // Example if needed
      // 'janusweb.ui.themes.path': 'assets/webui/themes/', // Example if needed
    }).then(function(client) {
      window.janus = client;
      console.log('[Mondocosm Init] elation.janusweb.init promise resolved. Client:', client);
      if (client && client.janusweb && typeof client.janusweb.stopNetworking === 'function') {
        client.janusweb.stopNetworking();
        console.log('[Mondocosm Init] Called client.janusweb.stopNetworking()');
      }
    }).catch(function(err) {
      console.error('[Mondocosm Init] elation.janusweb.init promise rejected. Error:', err);
    });
  } else {
    console.error('[Mondocosm Init] Pre-requisites for JanusWeb init not met. elation:', elation, 'elation.janusweb:', (elation ? elation.janusweb : 'N/A'));
  }
});

if (document.readyState === "complete" || document.readyState === "loaded" || document.readyState === "interactive") {
  console.log("[JanusInitScript] Document already loaded, triggering DOMContentLoaded manually.");
  document.dispatchEvent(new Event("DOMContentLoaded"));
}
`;
        }

        const dependencyFixes = getDependencyFixScripts_inline();
        const configOverrides = getConfigScript_inline(janusWebBuildPath, window.location.hostname, window.location.port, window.location.protocol);
        const parentOriginForIframe = window.location.origin; // Capture parent origin
        const janusInitializer = getJanusInitScript_inline(parentOriginForIframe); // Pass it to the function

        // Minimal iframe content - no scripts embedded as strings
        const iframeContent = [
            '<!DOCTYPE html>\n',
            '<html>\n',
            '<head>\n',
            '    <title>JanusWeb Embedded</title>\n',
            '    <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.js"><\/script>\n', // Load three.js first in iframe
            '    <script>\n', // then extendclass polyfill
            '      if (typeof window.extendclass === "undefined") {\n',
            '        console.log("[iFrameContent] Defining CLASS-BASED extendclass polyfill.");\n',
            '        window.extendclass = class {\n',
            '          constructor(parent, child) {\n',
            '            if (!child) { console.error("extendclass constructor: child is undefined."); return; }\n',
            '            if (!parent || !parent.prototype) { console.error("extendclass constructor: Parent or parent.prototype is undefined."); return; }\n',
            '            for (var key in parent.prototype) {\n',
            '              if (parent.prototype.hasOwnProperty(key)) {\n',
            '                if (!child.prototype.hasOwnProperty(key)) { child.prototype[key] = parent.prototype[key]; }\n',
            '              }\n',
            '            }\n',
            '            if (!child.prototype.hasOwnProperty("constructor")) { child.prototype.constructor = child; }\n',
            '            child.prototype.parent = parent.prototype;\n',
            '          }\n',
            '          static extend(parent, child) {\n',
            '            if (!child) { console.error("extendclass.extend: child is undefined."); return child; }\n',
            '            if (!parent || !parent.prototype) { console.error("extendclass.extend: Parent or parent.prototype is undefined."); return child; }\n',
            '            for (var key in parent.prototype) {\n',
            '              if (parent.prototype.hasOwnProperty(key)) {\n',
            '                if (!child.prototype.hasOwnProperty(key)) { child.prototype[key] = parent.prototype[key]; }\n',
            '              }\n',
            '            }\n',
            '            if (!child.prototype.hasOwnProperty("constructor")) { child.prototype.constructor = child; }\n',
            '            child.prototype.parent = parent.prototype;\n',
            '            return child;\n',
            '          }\n',
            '        };\n',
            '      } else {\n',
            '        console.log("[iFrameContent] window.extendclass ALREADY EXISTS. Type:", typeof window.extendclass);\n',
            '      }\n',
            '    <\/script>\n',
            '    <style>\n',
            '        body, html { margin: 0; padding: 0; height: 100%; }\n',
            '        #janusweb_container { width: 100%; height: 100%; }\n',
            '    </style>\n',
            '</head>\n',
            '<body>\n',
            '    <div id="janusweb_container"></div>\n',
            '    <p>Loading JanusWeb...</p>\n',
            '</body>\n',
            '</html>\n'
        ].join('\n');

        iframe.srcdoc = iframeContent;
        iframe.onload = function() {
            loading.style.display = 'none';
            console.log("JanusWeb iframe srcdoc content has triggered iframe.onload.");
            
            if (iframe.contentWindow && iframe.contentDocument) {
                console.log("IFRAME ONLOAD: iframe.contentWindow is available.");
                
                try {
                    // Order:
                    // 1. Config overrides (elation.config)
                    // 2. Dependency fixes (clamp polyfill, needs THREE from iframeContent's three.js)
                    // 3. JanusWeb main script
                    // 4. JanusWeb init script (elation.janusweb.init)

                    const configScriptEl = iframe.contentDocument.createElement('script');
                    configScriptEl.textContent = configOverrides;
                    iframe.contentDocument.head.appendChild(configScriptEl);
                    console.log("Injected configOverrides script into iframe head.");

                    const dependencyFixesScriptEl = iframe.contentDocument.createElement('script');
                    dependencyFixesScriptEl.textContent = dependencyFixes; // Contains clamp polyfill
                    iframe.contentDocument.head.appendChild(dependencyFixesScriptEl);
                    console.log("Injected dependencyFixes script into iframe head.");
                    
                    const janusScriptEl = iframe.contentDocument.createElement('script');
                    janusScriptEl.src = janusWebBuildPath + 'janusweb.min.js';
                    janusScriptEl.onload = function() {
                        console.log("JanusWeb script (janusweb.min.js) loaded in iframe.");
                        
                        // Initialize JanusWeb AFTER janusweb.min.js has loaded
                        const initScriptEl = iframe.contentDocument.createElement('script');
                        initScriptEl.textContent = janusInitializer; // This calls elation.janusweb.init()
                        iframe.contentDocument.head.appendChild(initScriptEl);
                        console.log("Injected janusInitializer script into iframe head.");
                    };
                    janusScriptEl.onerror = function() {
                        console.error("Failed to load JanusWeb script (janusweb.min.js) from:", janusWebBuildPath + 'janusweb.min.js');
                    };
                    iframe.contentDocument.head.appendChild(janusScriptEl);
                    
                } catch (err) {
                    console.error("Error injecting scripts into iframe:", err);
                }
                
            } else {
                console.error("IFRAME ONLOAD: iframe.contentWindow or contentDocument is NOT available.");
            }
        };
        iframe.onerror = function(e) {
            console.error("Error loading iframe srcdoc:", e);
            loading.textContent = 'Error loading JanusWeb via srcdoc.';
        };
        console.log("Set iframe.srcdoc with minimal controlled content.");

    </script>
</body>
</html>
