<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header class="top-toolbar">
        <div class="toolbar-title">MUNDIAL</div>
        <div class="toolbar-center">
            <input type="text" class="toolbar-input" placeholder="Search or enter command...">
        </div>
        <nav class="toolbar-nav">
            <ul>
                <li class="dropdown">
                    <a href="#" class="dropbtn">File</a>
                    <div class="dropdown-content">
                        <a href="#">New</a>
                        <a href="#">Open</a>
                        <a href="#">Save</a>
                    </div>
                </li>
                <li class="dropdown">
                    <a href="#" class="dropbtn">Edit</a>
                    <div class="dropdown-content">
                        <a href="#">Cut</a>
                        <a href="#">Copy</a>
                        <a href="#">Paste</a>
                    </div>
                </li>
                 <li class="dropdown">
                    <a href="#" class="dropbtn">View</a>
                    <div class="dropdown-content">
                        <a href="#">Zoom In</a>
                        <a href="#">Zoom Out</a>
                    </div>
                </li>
                {/* Add more menus as needed */}
            </ul>
        </nav>
        <div class="toolbar-view-buttons">
            <button class="toolbar-button" id="map-view-btn">Map</button>
            <button class="toolbar-button" id="globe-view-btn">Globe</button>
            <button class="toolbar-button" id="xr-view-btn">XR</button>
            <button class="toolbar-button" id="layers-btn">Layers</button>
            <button class="toolbar-button" id="profile-btn">Profile</button>
        </div>
    </header>

    <div class="auth-container">
        <!-- Sign In Form -->
        <div id="signin-form" class="auth-form">
            <h2>Sign In</h2>
            <form>
                <div class="form-group">
                    <label for="signin-email">Email:</label>
                    <input type="email" id="signin-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="signin-password">Password:</label>
                    <input type="password" id="signin-password" name="password" required>
                </div>
                <button type="submit">Sign In</button>
            </form>
            <p>Don't have an account? <a href="#" onclick="toggleForms()">Sign Up</a></p>
        </div>

        <!-- Sign Up Form -->
        <div id="signup-form" class="auth-form" style="display: none;">
            <h2>Sign Up</h2>
            <form>
                <div class="form-group">
                    <label for="signup-username">Username:</label>
                    <input type="text" id="signup-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email:</label>
                    <input type="email" id="signup-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password:</label>
                    <input type="password" id="signup-password" name="password" required>
                </div>
                 <div class="form-group">
                    <label for="signup-confirm-password">Confirm Password:</label>
                    <input type="password" id="signup-confirm-password" name="confirm_password" required>
                </div>
                <button type="submit">Sign Up</button>
            </form>
            <p>Already have an account? <a href="#" onclick="toggleForms()">Sign In</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
